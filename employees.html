<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Controle de Horas | NJR</title>
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest-emp.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NJR Controle de Horas">
<meta name="theme-color" content="#0d2137">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root { --navy:#0d2137; --navy2:#1a3a5c; --orange:#e8820c; --orng2:#f59c2a; --bg:#f0f4f8; }
* { box-sizing:border-box; }
body { font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:#1a2b3c; margin:0; overflow-x:hidden; }
html { overflow-x:hidden; }

/* LOGIN */
#loginScreen { min-height:100vh; background:linear-gradient(135deg,#061522 0%,var(--navy2) 50%,#061522 100%); display:flex; align-items:center; justify-content:center; padding:24px; }
.login-wrap  { width:100%; max-width:420px; }
.login-card  { background:rgba(255,255,255,.07); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:48px 40px; text-align:center; }
.login-icon  { width:80px; height:80px; background:#fff; border-radius:20px; display:inline-flex; align-items:center; justify-content:center; margin-bottom:24px; box-shadow:0 8px 32px rgba(0,0,0,.35); overflow:hidden; padding:10px; }
.login-icon img { width:100%; height:100%; object-fit:contain; }
.login-card h1 { color:#fff; font-size:26px; font-weight:800; margin:0 0 6px; }
.login-card p  { color:rgba(255,255,255,.5); font-size:14px; margin:0 0 36px; }
.login-input   { width:100%; background:rgba(255,255,255,.08); border:1.5px solid rgba(255,255,255,.18); border-radius:12px; padding:14px 18px; font-size:15px; color:#fff; transition:border-color .25s; margin-bottom:12px; }
.login-input:focus { outline:none; border-color:var(--orange); background:rgba(255,255,255,.12); }
.login-input::placeholder { color:rgba(255,255,255,.35); }
.login-btn   { width:100%; background:var(--orange); border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:700; color:#fff; cursor:pointer; transition:all .25s; }
.login-btn:hover { background:var(--orng2); transform:translateY(-2px); box-shadow:0 8px 24px rgba(232,130,12,.4); }
.login-btn:disabled { opacity:.7; cursor:not-allowed; transform:none; }
.login-error  { color:#ff6b6b; font-size:13px; margin-top:12px; display:none; }
.login-footer { color:rgba(255,255,255,.25); font-size:12px; text-align:center; margin-top:20px; }

/* MAIN APP */
#mainApp { display:none; }
.app-header { background:var(--navy); padding:16px 20px; display:flex; align-items:center; gap:16px; box-shadow:0 2px 20px rgba(0,0,0,.25); position:sticky; top:0; z-index:100; }
.brand-icon { width:88px; height:88px; background:#fff; border-radius:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; padding:8px; }
.brand-icon img { width:100%; height:100%; object-fit:contain; }
.brand-body { flex:1; min-width:0; }
.brand-name { color:#fff; font-size:32px; font-weight:800; line-height:1.15; }
.brand-footer { display:flex; align-items:center; gap:8px; margin-top:7px; }
.brand-sub  { color:rgba(255,255,255,.5); font-size:14px; display:block; margin-top:3px; }
.logout-btn { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:6px 14px; color:#fff; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; flex-shrink:0; }
.logout-btn:hover { background:rgba(255,255,255,.2); }

@media (max-width:480px) {
  .app-header { padding:14px 16px; gap:14px; }
  .brand-icon { width:76px; height:76px; border-radius:16px; }
  .brand-name { font-size:27px; }
  .login-card { padding:36px 24px; }
}

/* TIME PICKER */
.tp-col { flex:1; height:216px; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.tp-col::-webkit-scrollbar { display:none; }
.tp-item { height:44px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:600; color:var(--navy); scroll-snap-align:center; user-select:none; }

/* TABS */
.tab-nav { background:#fff; border-bottom:1px solid #e4ecf4; padding:0 28px; display:flex; gap:4px; overflow-x:auto; position:relative; scroll-behavior:smooth; }
.tab-nav.no-smooth-scroll { scroll-behavior:auto; }
.tab-btn { background:none; border:none; padding:16px 22px; font-size:14px; font-weight:600; color:#7b8ea4; cursor:pointer; display:flex; align-items:center; gap:8px; transition:color .2s; white-space:nowrap; flex-shrink:0; }
.tab-btn.active { color:var(--navy); }
.tab-btn:hover:not(.active) { color:var(--navy2); }
.tab-indicator { position:absolute; bottom:0; left:0; width:0; height:3px; background:var(--orange); border-radius:2px 2px 0 0; pointer-events:none; transition:left .22s ease, width .22s ease; }
#pageViewport { position:relative; overflow:hidden; }

/* PAGE */
.page { padding:24px; max-width:700px; margin:0 auto; will-change:transform; }

/* FORMS */
.form-section { background:#fff; border-radius:16px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.05); margin-bottom:20px; }
.section-title { font-size:16px; font-weight:700; color:var(--navy); margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid #f0f4f8; display:flex; align-items:center; gap:10px; }
.required-note { font-size:12px; color:#7b8ea4; margin-bottom:18px; }
.required-note span { color:var(--orange); font-weight:700; }
.f-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:#7b8ea4; margin-bottom:6px; display:block; }
.f-req { color:var(--orange); }
.f-input { width:100%; border:2px solid #dde7f1; border-radius:10px; padding:11px 14px; font-size:14px; color:var(--navy); background:#fff; transition:border-color .2s; font-family:inherit; }
.f-input:focus { outline:none; border-color:var(--orange); }
.f-input:disabled { background:#f8fafd; color:#7b8ea4; cursor:default; }
.f-input-prefix { position:relative; }
.f-input-prefix .prefix { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:14px; font-weight:700; color:#7b8ea4; pointer-events:none; }
.f-input-prefix .f-input { padding-left:30px; }
.f-hint { font-size:11px; color:#7b8ea4; margin-top:5px; }
.submit-btn { background:var(--orange); border:none; border-radius:12px; padding:13px 30px; font-size:15px; font-weight:700; color:#fff; cursor:pointer; transition:all .2s; display:inline-flex; align-items:center; gap:8px; margin-top:8px; width:100%; justify-content:center; }
.submit-btn:hover { background:var(--orng2); transform:translateY(-2px); box-shadow:0 8px 24px rgba(232,130,12,.35); }
.submit-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; box-shadow:none; }
.f-alert { border-radius:10px; padding:13px 18px; font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px; margin-top:16px; }
.f-alert.ok  { background:#d4edda; border:1px solid #c3e6cb; color:#155724; }
.f-alert.err { background:#f8d7da; border:1px solid #f5c6cb; color:#721c24; }

/* ADDR AUTOCOMPLETE */
.addr-wrap { position:relative; }
.addr-input { width:100%; border:2px solid #dde7f1; border-radius:10px; padding:10px 36px 10px 14px; font-size:14px; font-weight:500; color:var(--navy); background:#fff; transition:border-color .2s; }
.addr-input:focus { outline:none; border-color:var(--orange); }
.addr-clear-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%); width:24px; height:24px; border:none; background:#dde7f1; color:#5a7088; border-radius:50%; font-size:14px; line-height:1; cursor:pointer; display:none; align-items:center; justify-content:center; padding:0; z-index:2; }
.addr-clear-btn:hover { background:#c8d6e5; color:#1a2b3c; }
.addr-dropdown { display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:2px solid var(--orange); border-radius:12px; max-height:260px; overflow-y:auto; z-index:500; box-shadow:0 8px 28px rgba(0,0,0,.14); }
.addr-dropdown.open { display:block; }
.addr-opt { padding:10px 14px; font-size:13.5px; cursor:pointer; color:var(--navy); display:flex; align-items:center; gap:8px; transition:background .15s; }
.addr-opt:hover,.addr-opt.active { background:rgba(232,130,12,.08); color:var(--orange); }
.addr-opt-empty { padding:12px 14px; font-size:13px; color:#7b8ea4; }

/* MATERIALS CONDITIONAL BLOCK */
#materialBlock { display:none; margin-top:4px; }
#materialBlock.show { display:block; }

/* PHOTO UPLOAD */
.photo-zone { border:2px dashed #dde7f1; border-radius:12px; padding:16px; background:#fafcff; transition:border-color .2s; }
.photo-zone:hover { border-color:#aac4e0; }
.photo-btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.photo-btn { border:none; border-radius:10px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:all .2s; }
.photo-btn.camera { background:var(--orange); color:#fff; }
.photo-btn.camera:hover { background:var(--orng2); }
.photo-btn.gallery { background:#f0f4f8; color:var(--navy); border:2px solid #dde7f1; }
.photo-btn.gallery:hover { background:#dde7f1; }
.photo-btn:disabled { opacity:.6; cursor:not-allowed; }
.photo-thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
.photo-thumb-wrap { position:relative; }
.photo-thumb { width:76px; height:76px; border-radius:8px; object-fit:cover; border:2px solid #dde7f1; display:block; }
.photo-remove { position:absolute; top:-6px; right:-6px; width:20px; height:20px; background:#e74c3c; color:#fff; border:none; border-radius:50%; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; }
.photo-status { border-radius:8px; padding:10px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; margin-top:8px; }
.photo-status.loading { background:#e8f4fd; color:#1565c0; }
.photo-status.ok  { background:#d4edda; color:#155724; }
.photo-status.err { background:#f8d7da; color:#721c24; }

/* PAYMENT CARD (Tab 2) */
.week-bar { background:#fff; border-radius:16px; padding:18px 24px; box-shadow:0 2px 12px rgba(0,0,0,.05); display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:20px; }
.wk-nav { width:40px; height:40px; border-radius:10px; border:2px solid #dde7f1; background:#fff; color:var(--navy); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; }
.wk-nav:hover { border-color:var(--orange); color:var(--orange); }
.wk-display { text-align:center; min-width:200px; }
.wk-range { font-size:18px; font-weight:800; color:var(--navy); }
.wk-sub   { font-size:12px; color:#7b8ea4; margin-top:3px; }
.pay-card { background:linear-gradient(135deg,var(--navy),var(--navy2)); border-radius:16px; padding:24px; color:#fff; margin-bottom:20px; box-shadow:0 4px 20px rgba(13,33,55,.3); }
.pay-card-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:rgba(255,255,255,.5); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.pay-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px; }
.pay-row:last-of-type { border-bottom:none; }
.pay-row-lbl { color:rgba(255,255,255,.7); }
.pay-row-val { font-weight:700; color:#fff; }
.pay-divider { border:none; border-top:1px solid rgba(255,255,255,.2); margin:12px 0; }
.pay-total-row { display:flex; justify-content:space-between; align-items:center; padding-top:12px; }
.pay-total-lbl { font-size:15px; font-weight:700; color:rgba(255,255,255,.85); }
.pay-total-val { font-size:24px; font-weight:900; color:var(--orange); }

/* DATA TABLE */
.data-table { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,.05); overflow:hidden; }
.table-head { padding:18px 22px; border-bottom:1px solid #f0f4f8; font-size:14px; font-weight:700; color:var(--navy); }
.table-responsive { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; }
thead th { background:#f8fafd; padding:11px 18px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:#7b8ea4; text-align:left; white-space:nowrap; }
tbody td { padding:13px 18px; border-bottom:1px solid #f4f7fb; font-size:13px; color:#2c3e50; vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover td { background:#fafbfe; }
.day-badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; background:rgba(232,130,12,.1); color:var(--orange); }

/* STATES */
.loading-box { padding:60px 24px; text-align:center; color:#7b8ea4; font-size:14px; display:flex; align-items:center; justify-content:center; gap:12px; }
.spinner { width:22px; height:22px; border:3px solid #dde7f1; border-top-color:var(--orange); border-radius:50%; animation:spin .75s linear infinite; display:inline-block; flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }
.empty-box { padding:60px 24px; text-align:center; color:#7b8ea4; }
.empty-box i { font-size:44px; display:block; margin-bottom:14px; opacity:.35; }

/* TOAST */
.toast-wrap { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:9999; pointer-events:none; }
.toast { background:#155724; color:#fff; border-radius:12px; padding:14px 22px; font-size:14px; font-weight:600; box-shadow:0 8px 28px rgba(0,0,0,.25); display:flex; align-items:center; gap:10px; white-space:nowrap; opacity:0; transition:opacity .3s; }
.toast.show { opacity:1; }
.toast.err { background:#721c24; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-icon"><img src="/icon-192.png" alt="NJR"></div>
      <h1>Controle de Horas</h1>
      <p>Área do Funcionário — NJR Bathrooms</p>
      <input type="password" id="pwdInput" class="login-input" placeholder="Digite sua senha" autocomplete="off">
      <button class="login-btn" id="loginBtn" onclick="doLogin()"><i class="fas fa-lock-open" style="margin-right:8px"></i>Entrar</button>
      <div class="login-error" id="loginErr"><i class="fas fa-exclamation-circle" style="margin-right:4px"></i><span id="loginErrMsg">Senha incorreta</span></div>
    </div>
    <div class="login-footer">NJR Bathrooms &copy; 2026 &nbsp;·&nbsp; Área restrita</div>
  </div>
</div>

<!-- APP -->
<div id="mainApp">
  <div class="app-header">
    <div class="brand-icon"><img src="/icon-192.png" alt="NJR"></div>
    <div class="brand-body">
      <div class="brand-name">NJR Controle de Horas</div>
      <span class="brand-sub" id="empNameHeader">Funcionário</span>
      <div class="brand-footer">
        <button class="logout-btn" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> Sair</button>
      </div>
    </div>
  </div>

  <!-- TAB NAV -->
  <div class="tab-nav" id="tabNav">
    <button class="tab-btn active" id="t1btn" onclick="showTab(1)"><i class="fas fa-clock"></i> Registrar Horas</button>
    <button class="tab-btn" id="t2btn" onclick="showTab(2)"><i class="fas fa-calendar-week"></i> Minha Semana</button>
    <div class="tab-indicator" id="tabIndicator"></div>
  </div>

  <!-- PAGES -->
  <div id="pageViewport">

    <!-- TAB 1 — REGISTRAR HORAS -->
    <div class="page" id="t1page">
      <div class="form-section">
        <div class="section-title"><i class="fas fa-clock" style="color:var(--orange)"></i>Registro Diário de Trabalho</div>
        <p class="required-note">Campos com <span>*</span> são obrigatórios.</p>

        <!-- Endereço -->
        <div class="mb-3">
          <label class="f-label">Endereço da Obra <span class="f-req">*</span></label>
          <div class="addr-wrap">
            <input type="text" id="addrInput" class="addr-input" placeholder="Digite para filtrar endereços..."
                   oninput="filterAddrs(this.value)" onfocus="filterAddrs(this.value)" onblur="closeAddrDD()" autocomplete="off">
            <button class="addr-clear-btn" id="clearAddr" onclick="clearAddr()">×</button>
            <div id="addrDropdown" class="addr-dropdown"></div>
          </div>
        </div>

        <!-- Nome (read-only) -->
        <div class="mb-3">
          <label class="f-label">Nome do Funcionário</label>
          <input type="text" id="empNameField" class="f-input" disabled>
        </div>

        <!-- Hora de entrada / saída — texto com auto-formatação 24h -->
        <div class="row g-3 mb-1">
          <div class="col-6">
            <label class="f-label">Hora de Entrada <span class="f-req">*</span></label>
            <input type="text" id="entryTime" class="f-input" placeholder="08:00"
                   readonly style="cursor:pointer" onclick="openTP('entryTime','Hora de Entrada')">
          </div>
          <div class="col-6">
            <label class="f-label">Hora de Saída <span class="f-req">*</span></label>
            <input type="text" id="exitTime" class="f-input" placeholder="17:00"
                   readonly style="cursor:pointer" onclick="openTP('exitTime','Hora de Saída')">
          </div>
        </div>
        <p class="f-hint mb-3"><i class="fas fa-info-circle"></i> Toque no campo para selecionar o horário (formato 24h)</p>

        <!-- Comprou materiais -->
        <div class="mb-3">
          <label class="f-label">Comprou Materiais Hoje? <span class="f-req">*</span></label>
          <select id="boughtMaterials" class="f-input" onchange="toggleMaterialBlock()">
            <option value="Não">Não</option>
            <option value="Sim">Sim</option>
          </select>
        </div>

        <!-- Material conditional block -->
        <div id="materialBlock">
          <div class="mb-3">
            <label class="f-label">Valor Total Gasto <span class="f-req">*</span></label>
            <div class="f-input-prefix">
              <span class="prefix">$</span>
              <input type="text" id="totalSpent" class="f-input" placeholder="0.00" inputmode="decimal">
            </div>
          </div>

          <div class="mb-3">
            <label class="f-label">Quem Pagou? <span class="f-req">*</span></label>
            <select id="whoPaid" class="f-input">
              <option value="">Selecione...</option>
              <option value="NJR Bathrooms (Nilmar)">NJR Bathrooms (Nilmar)</option>
              <option value="Employee (for reimbursement)">Employee (for reimbursement)</option>
            </select>
          </div>

          <!-- Photo upload — multiple photos supported -->
          <div class="mb-3">
            <label class="f-label">Foto(s) do Recibo <span class="f-req">*</span></label>
            <div class="photo-zone" id="photoZone">
              <div class="photo-btn-row">
                <button type="button" class="photo-btn camera" id="cameraBtn" onclick="triggerCamera()">
                  <i class="fas fa-camera"></i> Câmera
                </button>
                <button type="button" class="photo-btn gallery" id="galleryBtn" onclick="triggerGallery()">
                  <i class="fas fa-images"></i> Galeria
                </button>
              </div>
              <input type="file" id="cameraInput"  accept="image/*" capture="environment" style="display:none" onchange="handlePhotoSelect(this)">
              <input type="file" id="galleryInput" accept="image/*" multiple           style="display:none" onchange="handlePhotoSelect(this)">
              <div class="photo-thumbs" id="photoThumbs"></div>
              <div id="photoStatus"></div>
            </div>
          </div>
        </div>

        <!-- Material necessário amanhã -->
        <div class="mb-3">
          <label class="f-label">Algum Material Necessário para Amanhã?</label>
          <textarea id="materialNeeded" class="f-input" rows="3" placeholder="Descreva o material que será necessário..."></textarea>
        </div>

        <!-- Observações -->
        <div class="mb-3">
          <label class="f-label">Observações / Sugestões</label>
          <textarea id="obs" class="f-input" rows="3" placeholder="Feedback, sugestões ou qualquer observação..."></textarea>
        </div>

        <button class="submit-btn" id="submitBtn" onclick="submitForm()">
          <i class="fas fa-paper-plane"></i> Enviar Registro
        </button>
        <div id="formAlert" style="display:none" class="f-alert"></div>
      </div>
    </div>

    <!-- TAB 2 — MINHA SEMANA -->
    <div class="page" id="t2page" style="display:none">

      <div class="week-bar">
        <button class="wk-nav" onclick="changeWeek(-1)"><i class="fas fa-chevron-left"></i></button>
        <div class="wk-display">
          <div class="wk-range" id="wkRange">—</div>
          <div class="wk-sub" id="wkSub"></div>
        </div>
        <button class="wk-nav" onclick="changeWeek(1)"><i class="fas fa-chevron-right"></i></button>
      </div>

      <div id="payCard"></div>
      <div id="weekTable"></div>
    </div>

  </div><!-- /pageViewport -->

</div><!-- /mainApp -->

<!-- TIME PICKER -->
<div id="tpOverlay" onclick="if(event.target===this)cancelTP()" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:2000;align-items:flex-end">
  <div style="background:#fff;width:100%;border-radius:20px 20px 0 0;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #f0f4f8">

<script>
// ══════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════
// TIME PICKER — seletor estilo iPhone, formato 24h

const TP_H = 44, TP_PAD = 86; // item height & top/bottom padding (216-44)/2
let _tpTarget = null;

function openTP(inputId, title) {
  const inp = document.getElementById(inputId);
  _tpTarget = inp;
  document.getElementById('tpTitle').textContent = title;
  let h = 8, m = 0;
  const val = (inp.value || '').trim();
  if (/^\d{2}:\d{2}$/.test(val)) { const p = val.split(':'); h = +p[0]; m = +p[1]; }
  const makeItems = (n) =>
    `<div style="height:${TP_PAD}px"></div>` +
    Array.from({length:n}, (_,i) => `<div class="tp-item">${String(i).padStart(2,'0')}</div>`).join('') +
    `<div style="height:${TP_PAD}px"></div>`;
  document.getElementById('tpHours').innerHTML = makeItems(24);
  document.getElementById('tpMins').innerHTML  = makeItems(60);
  document.getElementById('tpOverlay').style.display = 'flex';
  requestAnimationFrame(() => {
    document.getElementById('tpHours').scrollTop = h * TP_H;
    document.getElementById('tpMins').scrollTop  = m * TP_H;
  });
}

function confirmTP() {
  const h = Math.min(23, Math.max(0, Math.round(document.getElementById('tpHours').scrollTop / TP_H)));
  const m = Math.min(59, Math.max(0, Math.round(document.getElementById('tpMins').scrollTop  / TP_H)));
  if (_tpTarget) _tpTarget.value = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  document.getElementById('tpOverlay').style.display = 'none';
  _tpTarget = null;
}

async function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginErr');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;border-top-color:#fff;display:inline-block;margin-right:8px"></div>Entrando...';
  try {
    const res = await fetch('/api/emp-login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pwd })
    });
    const text = await res.text();
    let data = {};
    try { data = JSON.parse(text); } catch(e) {
      document.getElementById('loginErrMsg').textContent = 'Erro no servidor (HTTP ' + res.status + ').';
      errEl.style.display = 'block'; return;
    }
    if (!res.ok) {
      document.getElementById('loginErrMsg').textContent = data.error || 'Senha incorreta.';
      errEl.style.display = 'block'; return;
    }
    EMP_NAME = data.emp || '';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    document.getElementById('empNameHeader').textContent = EMP_NAME;
    document.getElementById('empNameField').value = EMP_NAME;
    await loadData();
  } catch(e) {
    document.getElementById('loginErrMsg').textContent = 'Erro de rede: ' + e.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock-open" style="margin-right:8px"></i>Entrar';
  }
}

async function doLogout() {
  await fetch('/api/emp-logout', { method:'POST' }).catch(()=>{});
  location.reload();
}

document.getElementById('pwdInput').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });

async function loadData() {

    DATA_LOADING = false;

  }
}

// ══════════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════════
let CURRENT_TAB = 1;
function getPageEl(n) { return document.getElementById('t' + n + 'page'); }
function getBtnEl(n)  { return document.getElementById('t' + n + 'btn');  }

function positionTabIndicator(n, animate) {
  const btn = getBtnEl(n), ind = document.getElementById('tabIndicator'), nav = document.getElementById('tabNav');
  if (!btn || !ind) return;
  ind.style.transition = animate ? 'left .22s ease, width .22s ease' : 'none';
  ind.style.left  = btn.offsetLeft + 'px';
  ind.style.width = btn.offsetWidth + 'px';
  if (nav) {
    nav.classList.toggle('no-smooth-scroll', !animate);
    const target = btn.offsetLeft - (nav.clientWidth - btn.offsetWidth) / 2;
    nav.scrollLeft = Math.max(0, Math.min(target, nav.scrollWidth - nav.clientWidth));
  }
}

// Transição estilo Instagram: slide horizontal suave ao clicar nas abas
function showTab(n) {
  const prev = CURRENT_TAB;
  if (n === prev) return;
  const viewport = document.getElementById('pageViewport');
  const curEl = getPageEl(prev), targetEl = getPageEl(n);
  const dir = n > prev ? 1 : -1;
  const viewW = viewport.offsetWidth || window.innerWidth;
  CURRENT_TAB = n;
  [1,2].forEach(i => getBtnEl(i).classList.toggle('active', n===i));
  positionTabIndicator(n, true);
  viewport.style.height = curEl.offsetHeight + 'px';
  targetEl.style.cssText = 'position:absolute;top:0;left:0;width:100%;transition:none;transform:translateX('+(dir*viewW)+'px)';
  curEl.style.transition = 'none';
  targetEl.style.display = 'block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const dur = 'transform .25s cubic-bezier(.25,.46,.45,.94)';
    curEl.style.transition = dur;
    targetEl.style.transition = dur;
    curEl.style.transform = 'translateX(' + (-dir*viewW) + 'px)';
    targetEl.style.transform = 'translateX(0)';
  }));
  setTimeout(()=>{
    curEl.style.cssText = 'display:none';
    targetEl.style.cssText = '';
    viewport.style.height = '';
    if (n===2) renderTab2();
  }, 260);
}

positionTabIndicator(1, false);
window.addEventListener('resize', ()=>positionTabIndicator(CURRENT_TAB, false));
window.addEventListener('load',   ()=>positionTabIndicator(CURRENT_TAB, false));

// ── SWIPE GESTURE — transição Instagram com rastreamento de velocidade ──
(function() {
  const EXCLUDE = '.addr-dropdown, input, textarea, select, .photo-zone, .table-responsive, .data-table';
  let startX=0, startY=0, phase='idle', dir=0, curN=0, targetN=0, viewW=0;
  let curEl=null, targetEl=null, viewport=null;
  let vel=0, lastX=0, lastT=0;

  function onTouchStart(e) {
    if (e.target.closest(EXCLUDE)) return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
    phase='pending'; dir=0; vel=0;
    lastX=startX; lastT=performance.now();
  }

  function onTouchMove(e) {
    if (phase==='idle'||phase==='edge') return;
    const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
    if (phase==='pending') {
      if (Math.abs(dy)>Math.abs(dx)+5) { phase='idle'; return; }
      if (Math.abs(dx)<8) return;
      dir=dx<0?1:-1;
      curN=CURRENT_TAB; targetN=curN+dir;
      if (targetN<1||targetN>2) { phase='edge'; return; }
      viewport=document.getElementById('pageViewport');
      curEl=getPageEl(curN); targetEl=getPageEl(targetN);
      viewW=viewport.offsetWidth||window.innerWidth;
      viewport.style.height=curEl.offsetHeight+'px';
      targetEl.style.cssText='position:absolute;top:0;left:0;width:100%;transition:none;transform:translateX('+(dir*viewW)+'px)';
      curEl.style.transition='none';
      targetEl.style.display='block';
      phase='dragging';
    }
    if (phase==='dragging') {
      e.preventDefault();
      // rastreia velocidade (px/ms)
      const now=performance.now(), dt=now-lastT;
      if (dt>0) vel=(e.touches[0].clientX-lastX)/dt;
      lastX=e.touches[0].clientX; lastT=now;
      const pct=Math.max(-1,Math.min(1,dx/viewW));
      curEl.style.transform='translateX('+(pct*viewW)+'px)';
      targetEl.style.transform='translateX('+((pct-dir)*viewW)+'px)';
    }
  }

  function onTouchEnd(e) {
    if (phase!=='dragging') { phase='idle'; return; }
    const dx=e.changedTouches[0].clientX-startX;
    // confirma se arrastou >25% OU velocidade suficiente na direção correta
    const fastFlick=Math.abs(vel)>0.4&&Math.sign(vel)!==Math.sign(dir);
    const commit=Math.abs(dx)>viewW*0.25||fastFlick;
    const commitDur='transform .25s cubic-bezier(.25,.46,.45,.94)';
    const snapDur='transform .2s cubic-bezier(.4,0,.6,1)';
    if (commit) {
      CURRENT_TAB=targetN;
      [1,2].forEach(i=>getBtnEl(i).classList.toggle('active',CURRENT_TAB===i));
      positionTabIndicator(CURRENT_TAB,true);
      curEl.style.transition=commitDur; targetEl.style.transition=commitDur;
      curEl.style.transform='translateX('+(-dir*viewW)+'px)';
      targetEl.style.transform='translateX(0)';
      setTimeout(()=>{
        curEl.style.cssText='display:none';
        targetEl.style.cssText='';
        viewport.style.height='';
        if (CURRENT_TAB===2) renderTab2();
      },260);
    } else {
      curEl.style.transition=snapDur; targetEl.style.transition=snapDur;
      curEl.style.transform='';
      targetEl.style.transform='translateX('+(dir*viewW)+'px)';
      setTimeout(()=>{
        targetEl.style.display='none';
        curEl.style.cssText=''; targetEl.style.cssText='';
        viewport.style.height='';
      },220);
    }
    phase='idle';
  }

  document.addEventListener('touchstart', onTouchStart, {passive:true});
  document.addEventListener('touchmove',  onTouchMove,  {passive:false});
  document.addEventListener('touchend',   onTouchEnd,   {passive:true});
})();

// ══════════════════════════════════════════════════════════
// IMAGE COMPRESSION — Canvas, max 1200px, JPEG 75%
// ══════════════════════════════════════════════════════════
function compressImage(file) {
  return new Promise(resolve => {
    const MAX=1200, QUALITY=0.75;
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w=img.width, h=img.height;
      if (w>MAX) { h=Math.round(h*MAX/w); w=MAX; }
      if (h>MAX) { w=Math.round(w*MAX/h); h=MAX; }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        const reader=new FileReader();
        reader.onload=e=>resolve({
          base64:  e.target.result.split(',')[1],
          preview: e.target.result,
          mimeType:'image/jpeg',
          name:    file.name.replace(/\.[^.]+$/,'.jpg')
        });
        reader.readAsDataURL(blob);
      },'image/jpeg',QUALITY);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(null); };
    img.src=url;
  });
}

// ══════════════════════════════════════════════════════════
// PHOTO HANDLING
// ══════════════════════════════════════════════════════════
function triggerCamera()  { document.getElementById('cameraInput').click(); }
function triggerGallery() { document.getElementById('galleryInput').click(); }

async function handlePhotoSelect(input) {
  const files=Array.from(input.files);
  if (!files.length) return;
  const statusEl=document.getElementById('photoStatus');
  statusEl.innerHTML=`<div class="photo-status loading"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Processando ${files.length} foto${files.length>1?'s':''}...</div>`;
  document.getElementById('cameraBtn').disabled=true;
  document.getElementById('galleryBtn').disabled=true;
  try {
    const compressed=await Promise.all(files.map(f=>compressImage(f)));
    selectedPhotos.push(...compressed.filter(Boolean));
    renderPhotoThumbs();
  } finally {
    document.getElementById('cameraBtn').disabled=false;
    document.getElementById('galleryBtn').disabled=false;
  }
  input.value='';
}

function renderPhotoThumbs() {
  const thumbsEl=document.getElementById('photoThumbs');
  const statusEl=document.getElementById('photoStatus');
  if (!selectedPhotos.length) { thumbsEl.innerHTML=''; statusEl.innerHTML=''; return; }
  thumbsEl.innerHTML=selectedPhotos.map((p,i)=>
    `<div class="photo-thumb-wrap">
      <img src="${p.preview}" class="photo-thumb" alt="foto ${i+1}">
      <button class="photo-remove" onclick="removePhoto(${i})" title="Remover">×</button>
    </div>`
  ).join('');
  const n=selectedPhotos.length;
  statusEl.innerHTML=`<div class="photo-status ok"><i class="fas fa-check-circle"></i> ${n} foto${n>1?'s':''} pronta${n>1?'s':''} para envio</div>`;
}

function removePhoto(idx) { selectedPhotos.splice(idx,1); renderPhotoThumbs(); }

async function uploadAllPhotos(addr) {
  if (!selectedPhotos.length) return '';
  const statusEl=document.getElementById('photoStatus');
  const n=selectedPhotos.length;
  statusEl.innerHTML=`<div class="photo-status loading"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div> Enviando ${n} foto${n>1?'s':''}...</div>`;
  const folderRes=await empWrite({action:'getOrCreateFolder',addr,subfolder:'Recibos'});
  if (folderRes.error) throw new Error(folderRes.error);
  const folderId=folderRes.id;
  const ts=Date.now();
  const results=await Promise.all(selectedPhotos.map((p,i)=>
    empWrite({ action:'uploadFile', folderId, fileBase64:p.base64, fileName:`recibo_${ts}_${i+1}_${p.name}`, mimeType:p.mimeType })
  ));
  const errs=results.filter(r=>r.error);
  if (errs.length) throw new Error(errs[0].error);
  statusEl.innerHTML=`<div class="photo-status ok"><i class="fas fa-check-circle"></i> ${results.length} foto${results.length>1?'s':''} enviada${results.length>1?'s':''}</div>`;
  return results.map(r=>r.fileUrl||'').filter(Boolean).join(', ');
}

// ══════════════════════════════════════════════════════════
// FORM SUBMISSION
// ══════════════════════════════════════════════════════════
async function submitForm() {
  const addr   =(document.getElementById('addrInput').value||SEL_ADDR||'').trim();
  const entry  = document.getElementById('entryTime').value.trim();
  const exit   = document.getElementById('exitTime').value.trim();
  const bought = document.getElementById('boughtMaterials').value;

  const errors=[];
  if (!addr)  errors.push('Endereço da obra é obrigatório.');
  if (!entry||!/^\d{2}:\d{2}$/.test(entry)) errors.push('Hora de entrada inválida (use HH:MM).');
  if (!exit ||!/^\d{2}:\d{2}$/.test(exit))  errors.push('Hora de saída inválida (use HH:MM).');
  if (bought==='Sim') {
    if (!document.getElementById('totalSpent').value.trim()) errors.push('Valor total gasto é obrigatório.');
    if (!document.getElementById('whoPaid').value)           errors.push('Selecione quem pagou os materiais.');
    if (!selectedPhotos.length && !receiptUrls)              errors.push('Foto do recibo é obrigatória.');
  }
  if (errors.length) { showAlert('err', errors.join(' ')); return; }

  const btn=document.getElementById('submitBtn');
  btn.disabled=true;
  btn.innerHTML='<div class="spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;margin-right:8px"></div>Enviando...';
  hideAlert();

  try {
    if (bought==='Sim' && selectedPhotos.length) receiptUrls=await uploadAllPhotos(addr);

    const result=await empWrite({
      action: 'addLabor', addr,
      entryTime: entry, exitTime: exit,
      boughtMaterials: bought,
      totalSpent:  bought==='Sim' ? document.getElementById('totalSpent').value.trim() : '',
      whoPaid:     bought==='Sim' ? document.getElementById('whoPaid').value : '',
      receiptUrl:  bought==='Sim' ? receiptUrls : '',
      materialNeeded: document.getElementById('materialNeeded').value.trim(),
      obs:         document.getElementById('obs').value.trim()
    });
    if (result.error) throw new Error(result.error);
    // Optimistic update: adiciona ao MY_LABOR para Tab 2 atualizar imediatamente
    MY_LABOR.unshift({
      'Carimbo de data/hora': new Date().toISOString(),
      'Nome do funcionário': EMP_NAME,
      'Endereço da obra': addr,
      'Hora de entrada': entry,
      'Hora de saída': exit,
      'Comprou materiais hoje?': bought,
      'Valor total gasto': bought==='Sim' ? document.getElementById('totalSpent').value.trim() : '',
      'Quem pagou?': bought==='Sim' ? document.getElementById('whoPaid').value : '',
    });
    showToast('Registro enviado com sucesso!');
    resetForm();
    loadData(); // sincroniza em background
  } catch(e) {
    showAlert('err', 'Erro ao enviar: ' + e.message);
  } finally {
    btn.disabled=false;
    btn.innerHTML='<i class="fas fa-paper-plane"></i> Enviar Registro';
  }
}

function resetForm() {
  SEL_ADDR='';
  document.getElementById('addrInput').value='';
  const cb=document.getElementById('clearAddr'); if(cb) cb.style.display='none';
  document.getElementById('entryTime').value='';
  document.getElementById('exitTime').value='';
  document.getElementById('boughtMaterials').value='Não';
  document.getElementById('totalSpent').value='';
  document.getElementById('whoPaid').value='';
  document.getElementById('materialNeeded').value='';
  document.getElementById('obs').value='';
  toggleMaterialBlock();
  selectedPhotos=[]; receiptUrls='';
  renderPhotoThumbs();
  hideAlert();
}

function showAlert(type, msg) {
  const el=document.getElementById('formAlert');
  el.className='f-alert '+type;
  el.innerHTML=`<i class="fas ${type==='ok'?'fa-check-circle':'fa-exclamation-triangle'}"></i>${msg}`;
  el.style.display='flex';
}
function hideAlert() { document.getElementById('formAlert').style.display='none'; }

// API HELPER
// ══════════════════════════════════════════════════════════
async function empWrite(params) {
  const res=await fetch('/api/emp-write',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(params)
  });
  if (res.status===401) { doLogout(); throw new Error('Sessão expirada.'); }
  const data=await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// ══════════════════════════════════════════════════════════
// TAB 2 — MINHA SEMANA
// ══════════════════════════════════════════════════════════
function getWeekBounds(offset) {
  const now=new Date(), dow=now.getDay();
  const sun=new Date(now); sun.setDate(now.getDate()-dow+offset*7); sun.setHours(0,0,0,0);
  const sat=new Date(sun); sat.setDate(sun.getDate()+6); sat.setHours(23,59,59,999);
  return { sun, sat };
}
function changeWeek(d) { wkOff+=d; renderTab2(); }
function fmtDate(d) { return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
function fmtDateFull(d) { return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
const DOW_SHORT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function parseDate(v) {
  if (!v) return null;
  const d=new Date(String(v).replace(/\//g,'-'));
  return isNaN(d.getTime())?null:d;
}
function parseHrs(v) {
  if (!v) return 0;
  const s=String(v).trim();
  if (s.includes(':')) { const [h,m]=s.split(':'); return parseInt(h||0)+parseInt(m||0)/60; }
  const n=parseFloat(s.replace(',','.')); return isNaN(n)?0:n;
}
function parseAmt(v) {
  if (!v&&v!==0) return 0;
  const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n;
}
function getRate(name) {
  for (const k of Object.keys(RATES)) {
    if (name&&(name===k||name.startsWith(k.split(' ')[0]))) return RATES[k];
  }
  return 20;
}
function $$(v) { return '$'+(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtHrs(h) {
  if (!h) return '0h';
  const hi=Math.floor(h), mi=Math.round((h-hi)*60);
  return mi ? hi+'h '+mi+'min' : hi+'h';
}

function renderTab2() {
  const { sun, sat } = getWeekBounds(wkOff);
  document.getElementById('wkRange').textContent = 'Dom '+fmtDate(sun)+' – Sáb '+fmtDate(sat);
  document.getElementById('wkSub').textContent   = wkOff===0 ? 'Semana atual' : 'Semana '+fmtDateFull(sun);

  if (DATA_LOADING) {
    document.getElementById('payCard').innerHTML='';
    document.getElementById('weekTable').innerHTML=
      `<div class="loading-box"><div class="spinner"></div> Carregando registros...</div>`;
    return;
  }

  const rows=MY_LABOR.filter(r=>{
    const ts=parseDate(r['Carimbo de data/hora']);
    return ts&&ts>=sun&&ts<=sat;
  });

  let totalHrs=0, totalReim=0;
  const daySet=new Set();

  const processed=rows.map(r=>{
    let hrs=parseHrs(r['Horas tabalhadas']||r['Horas trabalhadas']);
    if (!hrs){ const en=parseHrs(r['Hora de entrada']),ex=parseHrs(r['Hora de saída']); if(en>0&&ex>en) hrs=ex-en; }
    totalHrs+=hrs;
    const ts=parseDate(r['Carimbo de data/hora']);
    if (ts) daySet.add(ts.toDateString());
    const bought=String(r['Comprou materiais hoje?']||'').toLowerCase()==='sim';
    const paid  =String(r['Quem pagou?']||'').toLowerCase();
    const isReimb=bought&&(paid.includes('employee')||paid.includes('funcionário')||paid.includes('funcionario'));
    const reimb=isReimb?parseAmt(r['Valor total gasto']):0;
    totalReim+=reimb;
    return { ts, hrs, reimb, addr:String(r['Endereço da obra']||'').trim(), entry:r['Hora de entrada']||'', exit:r['Hora de saída']||'' };
  });

  const rate=getRate(EMP_NAME), laborPay=totalHrs*rate, gasoline=daySet.size*10, total=laborPay+totalReim+gasoline;

  document.getElementById('payCard').innerHTML = rows.length ? `
    <div class="pay-card">
      <div class="pay-card-title"><i class="fas fa-dollar-sign"></i> Demonstrativo de Pagamento</div>
      <div class="pay-row"><span class="pay-row-lbl">Horas trabalhadas</span><span class="pay-row-val">${fmtHrs(totalHrs)}</span></div>
      <div class="pay-row"><span class="pay-row-lbl">Valor M.O. (${fmtHrs(totalHrs)} × $${rate}/h)</span><span class="pay-row-val">${$$(laborPay)}</span></div>
      <div class="pay-row"><span class="pay-row-lbl">Reembolso de materiais</span><span class="pay-row-val">${$$(totalReim)}</span></div>
      <div class="pay-row"><span class="pay-row-lbl">Adicional gasolina (${daySet.size} dia${daySet.size!==1?'s':''} × $10)</span><span class="pay-row-val">${$$(gasoline)}</span></div>
      <hr class="pay-divider">
      <div class="pay-total-row"><span class="pay-total-lbl">Total a receber</span><span class="pay-total-val">${$$(total)}</span></div>
    </div>` : '';

  if (!processed.length) {
    document.getElementById('weekTable').innerHTML=
      `<div class="empty-box"><i class="fas fa-calendar-times"></i><strong>Nenhum registro nesta semana</strong></div>`;
    return;
  }

  const rowsHtml=processed.map(r=>{
    const dow=r.ts?DOW_SHORT[r.ts.getDay()]:'—';
    const date=r.ts?fmtDate(r.ts):'—';
    const reimbHtml=r.reimb>0?`<span style="color:#27ae60;font-weight:700">${$$(r.reimb)}</span>`:'—';
    return `<tr>
      <td><span class="day-badge">${dow}</span></td>
      <td>${date}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(r.addr)}">${escHtml(r.addr)}</td>
      <td>${r.entry||'—'}</td><td>${r.exit||'—'}</td>
      <td><strong>${fmtHrs(r.hrs)}</strong></td>
      <td>${reimbHtml}</td>
    </tr>`;
  }).join('');

  document.getElementById('weekTable').innerHTML=`
    <div class="data-table">
      <div class="table-head"><i class="fas fa-list" style="color:var(--orange);margin-right:8px"></i>Registros da Semana</div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>Dia</th><th>Data</th><th>Endereço</th><th>Entrada</th><th>Saída</th><th>Horas</th><th>Reembolso</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════
let _toastTimer=null;
function showToast(msg,type) {
  const el=document.getElementById('toast');
  el.className='toast'+(type==='err'?' err':'');
  el.innerHTML=`<i class="fas ${type==='err'?'fa-exclamation-triangle':'fa-check-circle'}"></i> ${msg}`;
  el.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),3500);
}
</script>
