<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NJR Casas de Aluguel</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest-rentals.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NJR Aluguéis">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
:root { --navy:#0d2137; --navy2:#12385c; --orange:#e8820c; --orng2:#cf7207; }
* { box-sizing:border-box; }
body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:#eef2f6; color:#2c3e50; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
#loginScreen { position:fixed; inset:0; z-index:9999; background:#fff url('/login-bg.png') center 24%/min(82vw,400px) no-repeat; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 34px + 10vh); }
.login-box { background:var(--navy); border-radius:22px; padding:30px 28px; width:min(400px,100%); box-shadow:0 24px 70px rgba(13,33,55,.45); border:1px solid rgba(232,130,12,.3); }
.login-box h1 { font-size:20px; font-weight:800; color:#fff; margin:0 0 4px; text-align:center; }
.login-box p.sub { font-size:11px; color:#f2a340; margin:0 0 18px; text-transform:uppercase; letter-spacing:2.5px; font-weight:700; text-align:center; }
.login-input { width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); color:#fff; padding:13px 18px; font-size:15px; border-radius:14px; text-align:center; transition:all .2s; }
.login-input::placeholder { color:rgba(255,255,255,.4); }
.login-input:focus { outline:none; background:rgba(255,255,255,.12); border-color:var(--orange); box-shadow:0 0 0 4px rgba(232,130,12,.18); color:#fff; }
.login-btn { width:100%; background:linear-gradient(135deg,var(--orange),#f59c2a); color:var(--navy); border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:800; margin-top:12px; cursor:pointer; transition:transform .12s; }
.login-btn:active { transform:scale(.97); }
.login-btn:disabled { opacity:.7; cursor:not-allowed; }
.login-err { display:none; color:#ff8585; font-size:13px; text-align:center; min-height:20px; margin-top:8px; }
.login-credit { margin-top:18px; text-align:center; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(13,33,55,.55); font-weight:600; }
#mainApp { display:none; }
.app-header { background:var(--navy); padding:calc(env(safe-area-inset-top) + 16px) 20px 16px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:100; box-shadow:0 2px 16px rgba(0,0,0,.2); }
.app-header .brand-icon { width:52px; height:52px; background:#fff; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:6px; flex-shrink:0; }
.app-header .brand-icon img { max-width:100%; }
.brand-name { color:#fff; font-size:19px; font-weight:800; line-height:1.1; }
.brand-sub { color:rgba(255,255,255,.55); font-size:12px; }
.logout-btn { margin-left:auto; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:9px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
.tab-nav { display:flex; gap:2px; background:#fff; padding:0 12px; overflow-x:auto; position:relative; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.tab-nav.no-smooth-scroll { scroll-behavior:auto; }
.tab-nav::-webkit-scrollbar { display:none; }
.tab-btn { flex:0 0 auto; border:none; background:none; padding:15px 16px; font-size:13.5px; font-weight:700; color:#7b8ea4; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:7px; transition:color .2s; }
.tab-btn.active { color:var(--navy); }
.tab-btn:hover:not(.active) { color:var(--navy2); }
.tab-indicator { position:absolute; bottom:0; left:0; width:0; height:3px; background:var(--orange); border-radius:2px 2px 0 0; pointer-events:none; transition:left .22s ease, width .22s ease; }
#pageViewport { position:relative; overflow:hidden; }
.page { padding:22px; max-width:1150px; margin:0 auto; }
.card2 { background:#fff; border-radius:16px; padding:20px; box-shadow:0 2px 12px rgba(0,0,0,.05); margin-bottom:18px; }
.sec-title { font-size:15px; font-weight:800; color:var(--navy); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
.metric-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
.metric { background:#fff; border-radius:14px; padding:16px 18px; box-shadow:0 2px 12px rgba(0,0,0,.05); border-left:4px solid var(--orange); }
.metric .lbl { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#7b8ea4; }
.metric .val { font-size:24px; font-weight:900; color:var(--navy); margin-top:3px; }
.metric.green { border-left-color:#27ae60; } .metric.green .val { color:#27ae60; }
.metric.red { border-left-color:#e74c3c; } .metric.red .val { color:#e74c3c; }
.house-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }
.house-card { background:#fff; border-radius:16px; padding:18px; box-shadow:0 2px 12px rgba(0,0,0,.06); border-top:4px solid var(--navy); }
.house-card.vac { border-top-color:#95a5a6; opacity:.92; }
.hc-addr { font-size:15px; font-weight:800; color:var(--navy); margin-bottom:2px; }
.hc-tenant { font-size:12px; color:#7b8ea4; margin-bottom:12px; }
.badge2 { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; margin:2px 4px 2px 0; }
.b-paid { background:rgba(39,174,96,.12); color:#27ae60; }
.b-pend { background:rgba(243,156,18,.14); color:#e67e22; }
.b-late { background:rgba(231,76,60,.12); color:#e74c3c; }
.b-vac { background:rgba(149,165,166,.18); color:#7f8c8d; }
.b-warn { background:rgba(230,126,34,.14); color:#d35400; }
.b-info { background:rgba(41,128,185,.12); color:#2980b9; }
.hc-rent { font-size:20px; font-weight:900; color:var(--navy); margin:8px 0; }
.mini-btn { border:none; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.mini-btn.pri { background:var(--orange); color:#fff; } .mini-btn.pri:hover { background:var(--orng2); }
.mini-btn.sec { background:#eef3f8; color:var(--navy); }
.mini-btn.danger { background:rgba(231,76,60,.1); color:#e74c3c; }
.mini-btn.ord-btn { padding:7px 9px; }
.mini-btn:disabled { opacity:.32; cursor:default; }
.f-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#7b8ea4; margin-bottom:5px; display:block; }
.f-input, .f-select { width:100%; padding:11px 13px; border:2px solid #dde7f1; border-radius:9px; font-size:14px; background:#fff; }
.f-input:focus, .f-select:focus { outline:none; border-color:var(--orange); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
@media(max-width:640px){ .grid2,.grid3{ grid-template-columns:1fr; } }
.mb { margin-bottom:12px; }
.btn-primary2 { background:var(--orange); color:#fff; border:none; border-radius:10px; padding:12px 20px; font-weight:700; font-size:14px; cursor:pointer; }
.btn-primary2:hover { background:var(--orng2); }
table { width:100%; border-collapse:collapse; }
thead th { background:#f8fafd; padding:10px 14px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#7b8ea4; text-align:left; white-space:nowrap; }
tbody td { padding:11px 14px; border-bottom:1px solid #f4f7fb; font-size:13px; }
.tbl-wrap { overflow-x:auto; }
.addr-wrap { position:relative; }
.addr-dd { position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid #dde7f1; border-radius:9px; box-shadow:0 8px 24px rgba(0,0,0,.12); max-height:220px; overflow-y:auto; z-index:50; display:none; margin-top:4px; }
.addr-dd div { padding:10px 13px; font-size:13px; cursor:pointer; }
.addr-dd div:hover { background:#f4f7fb; }
.modal-ov { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; display:none; align-items:flex-start; justify-content:center; padding:24px; overflow-y:auto; }
.modal-ov.show { display:flex; }
.modal-box { background:#fff; border-radius:16px; padding:24px; width:100%; max-width:640px; margin:auto; }
.modal-title { font-size:17px; font-weight:800; color:var(--navy); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.empty { padding:40px; text-align:center; color:#7b8ea4; }
.empty i { font-size:40px; opacity:.3; display:block; margin-bottom:12px; }
.njr-toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#1f2d3d; color:#fff; padding:12px 20px; border-radius:10px; font-size:14px; font-weight:600; box-shadow:0 8px 28px rgba(0,0,0,.3); display:flex; align-items:center; gap:8px; opacity:0; pointer-events:none; transition:.25s; z-index:2000; }
.njr-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.njr-toast i { color:#2ecc71; } .njr-toast.err i { color:#e74c3c; }
.spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ═══════════ DASHBOARD (redesign) ═══════════ */
:root{ --paid:#0f9d68; --paid-t:rgba(15,157,104,.12); --paid-d:#0b7a4f;
       --pend:#f2b705; --pend-t:rgba(242,183,5,.17); --pend-d:#96690a;
       --late:#e03131; --late-t:rgba(224,49,49,.10); --late-d:#c92a2a;
       --partial:#e8590c; --partial-t:rgba(232,89,12,.12); --partial-d:#c94a08;
       --vaca:#8794a3; --vaca-t:rgba(135,148,163,.16); --vaca-d:#5c6b7a; }
/* month navigator */
.mnav{ display:flex; align-items:center; gap:6px; background:var(--navy); border-radius:14px; padding:8px 10px; margin-bottom:16px; box-shadow:0 6px 20px rgba(13,33,55,.18); }
.mnav-arw{ width:38px; height:38px; border:none; border-radius:10px; background:rgba(255,255,255,.08); color:#fff; font-size:22px; line-height:1; cursor:pointer; transition:background .15s; display:flex; align-items:center; justify-content:center; }
.mnav-arw:hover{ background:var(--orange); }
.mnav-lbl{ flex:1; text-align:center; color:#fff; font-size:15px; font-weight:700; letter-spacing:3px; text-transform:uppercase; }
.mnav-lbl b{ color:var(--orange); font-weight:800; letter-spacing:1px; }
.mnav-today{ border:1px solid rgba(255,255,255,.25); background:none; color:rgba(255,255,255,.85); border-radius:9px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer; }
.mnav-today:hover{ background:rgba(255,255,255,.1); }
/* collection panel + rent-roll strip (signature) */
.coll{ background:#fff; border-radius:18px; padding:20px 22px 18px; box-shadow:0 4px 18px rgba(13,33,55,.07); margin-bottom:16px; }
.coll-eyebrow{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:15px; flex-wrap:wrap; }
.coll-eyebrow .lab{ font-size:11px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#8ba0b6; }
.coll-eyebrow .out{ font-size:14px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; }
.coll-eyebrow .out b{ font-weight:900; }
.coll-eyebrow .out.done{ color:var(--paid-d); }
.rr{ display:flex; align-items:flex-start; gap:6px; margin-bottom:14px; }
.rr-seg{ flex:1 1 0; min-width:22px; cursor:pointer; }
.rr-cell{ height:24px; border-radius:6px; transition:transform .12s; }
.rr-seg:hover .rr-cell{ transform:translateY(-3px); }
.rr-num{ margin-top:6px; text-align:center; font-size:10.5px; font-weight:700; line-height:1.2; color:#8497a8; white-space:normal; overflow-wrap:anywhere; hyphens:auto; }
.rr-seg:hover .rr-num{ color:var(--navy); }
.rr-cell.s-paid{ background:var(--paid); }
.rr-cell.s-pend{ background:var(--pend); }
.rr-cell.s-late{ background:var(--late); }
.rr-cell.s-partial{ background:repeating-linear-gradient(135deg,var(--partial),var(--partial) 5px,#fff 5px,#fff 6px); }
.rr-cell.s-vac{ background:repeating-linear-gradient(135deg,transparent,transparent 5px,rgba(135,148,163,.35) 5px,rgba(135,148,163,.35) 6px); border:1.5px dashed var(--vaca); }
.rr-legend{ display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; font-weight:600; color:#5c6b7a; font-variant-numeric:tabular-nums; }
.rr-legend .lg{ display:inline-flex; align-items:center; gap:7px; }
.rr-legend .dot{ width:9px; height:9px; border-radius:50%; }
.rr-legend b{ color:var(--navy); font-weight:800; }
/* renewals strip */
.renew{ border-radius:16px; padding:14px 18px; margin-bottom:16px; background:linear-gradient(180deg,#fff9ec,#fff2d1); border:1px solid rgba(242,183,5,.45); }
.renew-h{ font-size:11.5px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:#96690a; margin-bottom:11px; display:flex; align-items:center; gap:8px; }
.renew-items{ display:flex; flex-wrap:wrap; gap:8px; }
.renew-chip{ display:inline-flex; align-items:center; gap:9px; background:#fff; border-radius:11px; padding:8px 13px; font-size:13px; font-weight:700; color:var(--navy); border:1px solid rgba(0,0,0,.05); border-left-width:4px; cursor:pointer; transition:transform .12s; }
.renew-chip:hover{ transform:translateY(-2px); }
.renew-chip .kv{ font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:#8ba0b6; font-weight:800; }
.renew-chip b{ font-weight:900; font-variant-numeric:tabular-nums; }
.renew-chip.warn{ border-left-color:var(--pend); }
.renew-chip.late{ border-left-color:var(--late); } .renew-chip.late b{ color:var(--late-d); }
.renew-chip.info{ border-left-color:#4a90d9; }
/* house rows (retangulares, uma por linha) */
.hgrid{ display:flex; flex-direction:column; gap:10px; }
.hcard{ position:relative; display:flex; align-items:center; gap:18px; background:#fff; border-radius:14px; padding:14px 18px 14px 24px; box-shadow:0 3px 12px rgba(13,33,55,.06); overflow:hidden; }
.hcard-rail{ position:absolute; left:0; top:0; bottom:0; width:6px; }
.hcard.s-paid .hcard-rail{ background:var(--paid); } .hcard.s-paid{ background:linear-gradient(90deg,var(--paid-t),#fff 24%); }
.hcard.s-pend .hcard-rail{ background:var(--pend); }
.hcard.s-late .hcard-rail{ background:var(--late); } .hcard.s-late{ background:linear-gradient(90deg,var(--late-t),#fff 24%); }
.hcard.s-partial .hcard-rail{ background:var(--partial); } .hcard.s-partial{ background:linear-gradient(90deg,var(--partial-t),#fff 24%); }
.hcard.s-vac  .hcard-rail{ background:var(--vaca); } .hcard.s-vac{ opacity:.94; }
.hcard-flag{ margin-top:6px; font-size:11.5px; font-weight:800; color:var(--partial-d); background:var(--partial-t); border-radius:8px; padding:4px 9px; display:inline-flex; align-items:center; gap:6px; }
.hcard-flag i{ opacity:.9; }
.hcard-extra{ font-size:11.5px; color:#6f8296; margin-top:4px; }
.hcard-extra i{ margin-right:5px; opacity:.7; color:var(--partial-d); }
.hcard-main{ flex:1 1 auto; min-width:0; }
.hcard-headline{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.hcard-addr{ font-size:15px; font-weight:800; color:var(--navy); line-height:1.2; }
.hcard-tenant{ font-size:12.5px; color:#7b8ea4; margin-top:4px; }
.hcard-vig{ font-size:11.5px; color:#8497a8; margin-top:4px; font-variant-numeric:tabular-nums; }
.hcard-vig i{ margin-right:5px; opacity:.7; }
.hcard-tenant i{ margin-right:5px; opacity:.7; }
.pill{ flex:0 0 auto; font-size:10.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; padding:5px 10px; border-radius:20px; white-space:nowrap; }
.pill.p-paid{ background:var(--paid-t); color:var(--paid-d); }
.pill.p-pend{ background:var(--pend-t); color:var(--pend-d); }
.pill.p-late{ background:var(--late-t); color:var(--late-d); }
.pill.p-partial{ background:var(--partial-t); color:var(--partial-d); }
.pill.p-vac{ background:var(--vaca-t); color:var(--vaca-d); }
.hcard-badges{ margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }
.hcard-rent{ flex:0 0 auto; font-size:20px; font-weight:900; color:var(--navy); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.hcard-rent span{ font-size:12px; font-weight:600; color:#9aabbd; }
.hcard-rent-brk{ font-size:10.5px; font-weight:700; color:#9aabbd; margin-top:2px; white-space:nowrap; letter-spacing:.2px; }
.hcard-action{ flex:0 0 auto; width:240px; display:flex; }
@media(max-width:640px){ .hcard{ flex-wrap:wrap; gap:12px; } .hcard-main{ flex:1 1 100%; } .hcard-rent{ flex:0 0 auto; text-align:left; } .hcard-action{ flex:1 1 auto; width:auto; min-width:190px; } }
.act-btn{ flex:1; border:none; border-radius:10px; padding:11px 12px; font-size:13px; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:.15s; line-height:1.15; }
.act-btn.recv{ background:var(--orange); color:#fff; } .act-btn.recv:hover{ background:var(--orng2); }
.act-btn.paid{ background:var(--paid-t); color:var(--paid-d); font-weight:700; }
.act-btn.paid:hover{ background:rgba(15,157,104,.2); }
.act-btn.vac{ background:#eef3f8; color:var(--navy); }
.act-btn.partial{ background:var(--partial); color:#fff; } .act-btn.partial:hover{ filter:brightness(.95); }
.receb-flag{ display:none; margin-bottom:14px; font-size:12.5px; font-weight:700; color:var(--partial-d); background:var(--partial-t); border:1px solid rgba(232,89,12,.3); border-radius:10px; padding:10px 12px; }
.receb-flag.ok{ color:var(--paid-d); background:var(--paid-t); border-color:rgba(15,157,104,.3); }
.receb-flag i{ margin-right:6px; }
.receb-prev{ margin-bottom:12px; font-size:12.5px; color:var(--navy); background:#f4f7fb; border-radius:10px; padding:10px 12px; font-variant-numeric:tabular-nums; }
.receb-prev b{ font-weight:800; }
.subnav{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.subnav button{ border:none; background:#eef3f8; color:#5c6b7a; font-weight:700; font-size:13px; padding:9px 16px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; }
.subnav button.active{ background:var(--navy); color:#fff; }
.confirm{ flex:1; border:1.5px dashed var(--orange); border-radius:12px; padding:10px 12px; background:#fff8f0; }
.confirm-txt{ font-size:12.5px; color:var(--navy); font-weight:600; margin-bottom:9px; font-variant-numeric:tabular-nums; }
.confirm-txt b{ font-weight:900; }
.confirm-txt .ok{ color:var(--paid-d); font-weight:800; }
.confirm-txt .fine{ color:var(--late-d); font-weight:800; }
.confirm-btns{ display:flex; gap:8px; }
.c-adjust{ background:#eef3f8; color:var(--navy); border:none; border-radius:9px; padding:9px 12px; font-size:12px; font-weight:700; cursor:pointer; }
.c-adjust:hover{ background:#e2ebf4; }
.c-ok{ flex:1; background:var(--paid); color:#fff; border:none; border-radius:9px; padding:9px; font-size:12.5px; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.c-ok:hover{ filter:brightness(.95); }
@media(max-width:520px){ .hgrid{ grid-template-columns:1fr; } .mnav-lbl{ letter-spacing:2px; font-size:14px; } }
@media(prefers-reduced-motion:reduce){ .rr-cell,.renew-chip,.act-btn{ transition:none; } }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>NJR Casas de Aluguel</h1>
    <p class="sub">Área Administrativa</p>
    <input type="password" id="pwd" class="login-input" placeholder="Senha de acesso" autocomplete="off">
    <button class="login-btn" id="loginBtn" onclick="doLogin()"><i class="fas fa-shield-halved" style="margin-right:8px"></i>Entrar</button>
    <div class="login-err" id="loginErr"></div>
  </div>
  <div class="login-credit">built by FAR Process Improvement</div>
</div>

<div id="mainApp">
  <div class="app-header">
    <div class="brand-icon"><img src="/icon-192.png" alt="NJR"></div>
    <div>

</div>

<script>
// ══ ESTADO ══
let DB = { casas:[], recebimentos:[], custos:[], manutencao:[], alertas:[] };
const TIPOS_SERVICO = ['Plumbing','Painting','Drywall','Electrical','General Contracting','Plastering','Others'];

// ══ HELPERS ══
function $$ (n){ return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function parseAmt(v){ if(v==null||v==='')return 0; const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function parseDate(v){ if(!v)return null; const d=new Date(String(v).replace(/\//g,'-')); return isNaN(d.getTime())?null:d; }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad2(n){ return String(n).padStart(2,'0'); }
function todayComp(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtComp(c){ if(!/^\d{4}-\d{2}$/.test(c||''))return c||'—'; const [y,m]=c.split('-'); return MES[+m-1]+'/'+y; }
function fmtDate(v){ const d=parseDate(v); return d?pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear():'—'; }
function isOcupada(c){ if(String((c&&c['Inquilino'])||'').trim()) return true; const s=String((c&&c['Status'])||'').toLowerCase(); return s!=='vacância' && s!=='vacancia'; }
function ordVal(c){ const n=parseInt(c&&c['Ordem'],10); return isNaN(n)?1e9:n; }
function casasOrdered(){ return DB.casas.filter(c=>String(c['Endereço']||'').trim()).slice().sort((a,b)=>ordVal(a)-ordVal(b)); }

function showToast(msg,err){ let el=document.getElementById('njrToast'); if(!el){el=document.createElement('div');el.id='njrToast';el.className='njr-toast';document.body.appendChild(el);} el.innerHTML='<i class="fas '+(err?'fa-exclamation-triangle':'fa-check-circle')+'"></i> '+msg; el.classList.toggle('err',!!err); el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2400); }
function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

// ══ AUTH ══
async function doLogin(){
  const pwd=document.getElementById('pwd').value, btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
  err.style.display='none'; btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ err.textContent=d.error||'Senha incorreta.'; err.style.display='block'; return; }
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('mainApp').style.display='block';
    loadData();
  }catch(e){ err.textContent='Erro de rede: '+e.message; err.style.display='block'; }
  finally{ btn.disabled=false; btn.innerHTML='<i class="fas fa-shield-halved" style="margin-right:8px"></i>Entrar'; }
}
async function doLogout(){ await fetch('/api/logout',{method:'POST'}).catch(()=>{}); location.reload(); }
document.getElementById('pwd').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

// ══ DADOS ══
async function loadData(){
  document.getElementById('hdrSub').textContent='Carregando…';
  try{
    const r=await fetch('/api/rentals-data');
    if(r.status===401){ location.reload(); return; }
    DB=await r.json();
    if(DB.error) throw new Error(DB.error);
    document.getElementById('hdrSub').textContent=(DB.casas||[]).length+' casas · atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    renderAll();
  }catch(e){ document.getElementById('hdrSub').textContent='Erro ao carregar'; showToast('Erro: '+e.message,true); }
}
async function apiWrite(params){
  const r=await fetch('/api/rentals-write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});
  if(r.status===401){ doLogout(); throw new Error('Sessão expirada'); }
  const d=await r.json(); if(d.error) throw new Error(d.error); return d;
}
function renderAll(){ renderDash(); renderCad(); renderCustos(); renderMan(); renderFin(); requestAnimationFrame(()=>positionTabIndicator(CURRENT_TAB,false)); }

// ══ ABAS ══
let CURRENT_TAB=1;
function getPageEl(n){ return document.getElementById('tab'+n); }
function getBtnEl(n){ return document.getElementById('tab'+n+'btn'); }
function positionTabIndicator(n, animate){
  const btn=getBtnEl(n), ind=document.getElementById('tabIndicator'), nav=document.getElementById('tabNav');
  if(!btn||!ind)return;
  ind.style.transition = animate?'left .22s ease, width .22s ease':'none';
  ind.style.left=btn.offsetLeft+'px'; ind.style.width=btn.offsetWidth+'px';
  if(nav){ nav.classList.toggle('no-smooth-scroll',!animate); const target=btn.offsetLeft-(nav.clientWidth-btn.offsetWidth)/2; nav.scrollLeft=Math.max(0,Math.min(target,nav.scrollWidth-nav.clientWidth)); }
}
function lerpTabIndicator(a,b,f){
  const A=getBtnEl(a), B=getBtnEl(b), ind=document.getElementById('tabIndicator'); if(!A||!B||!ind)return;
  ind.style.transition='none';
  ind.style.left=(A.offsetLeft+(B.offsetLeft-A.offsetLeft)*f)+'px';
  ind.style.width=(A.offsetWidth+(B.offsetWidth-A.offsetWidth)*f)+'px';
}
function showTab(n){
  const prev=CURRENT_TAB; if(n===prev)return;
  const viewport=document.getElementById('pageViewport');
  const curEl=getPageEl(prev), targetEl=getPageEl(n);
  const dir=n>prev?1:-1, viewW=viewport.offsetWidth||window.innerWidth;
  CURRENT_TAB=n;
  [1,2,3,4,5].forEach(i=>getBtnEl(i).classList.toggle('active',n===i));
  positionTabIndicator(n,true);
  viewport.style.height=curEl.offsetHeight+'px';
  targetEl.style.cssText='position:absolute;top:0;left:0;width:100%;transition:none;transform:translateX('+(dir*viewW)+'px)';
  curEl.style.transition='none'; targetEl.style.display='block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const dur='transform .25s cubic-bezier(.25,.46,.45,.94)';
    curEl.style.transition=dur; targetEl.style.transition=dur;
    curEl.style.transform='translateX('+(-dir*viewW)+'px)'; targetEl.style.transform='translateX(0)';
  }));
  setTimeout(()=>{ curEl.style.cssText='display:none'; targetEl.style.cssText=''; viewport.style.height=''; },280);
}
window.addEventListener('resize',()=>positionTabIndicator(CURRENT_TAB,false));
window.addEventListener('load',()=>positionTabIndicator(CURRENT_TAB,false));

// ── SWIPE estilo Instagram (limiar 30%, cabeçalho acompanha) ──
(function(){
  const EXCLUDE='.addr-dd, input, textarea, select, .tbl-wrap, table, .modal-ov';
  let startX=0,startY=0,phase='idle',dir=0,curN=0,targetN=0,viewW=0,curEl=null,targetEl=null,viewport=null,vel=0,lastX=0,lastT=0;
  function onTouchStart(e){ if(e.target.closest(EXCLUDE))return; startX=e.touches[0].clientX; startY=e.touches[0].clientY; phase='pending'; dir=0; vel=0; lastX=startX; lastT=performance.now(); }
  function onTouchMove(e){
    if(phase==='idle'||phase==='edge')return;
    const dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY;
    if(phase==='pending'){
      if(Math.abs(dy)>Math.abs(dx)+5){ phase='idle'; return; }
      if(Math.abs(dx)<8)return;
      dir=dx<0?1:-1; curN=CURRENT_TAB; targetN=curN+dir;
      if(targetN<1||targetN>5){ phase='edge'; return; }
      viewport=document.getElementById('pageViewport'); curEl=getPageEl(curN); targetEl=getPageEl(targetN);
      viewW=viewport.offsetWidth||window.innerWidth;
      viewport.style.height=curEl.offsetHeight+'px';
      targetEl.style.cssText='position:absolute;top:0;left:0;width:100%;transition:none;transform:translateX('+(dir*viewW)+'px)';
      curEl.style.transition='none'; targetEl.style.display='block'; phase='dragging';
    }
    if(phase==='dragging'){
      e.preventDefault();
      const now=performance.now(),dt=now-lastT; if(dt>0)vel=(e.touches[0].clientX-lastX)/dt; lastX=e.touches[0].clientX; lastT=now;
      const pct=Math.max(-1,Math.min(1,dx/viewW));
      curEl.style.transform='translateX('+(pct*viewW)+'px)';
      targetEl.style.transform='translateX('+((pct+dir)*viewW)+'px)';
      lerpTabIndicator(curN,targetN,Math.min(1,Math.abs(pct)));
    }
  }
  function onTouchEnd(e){
    if(phase!=='dragging'){ phase='idle'; return; }
    const dx=e.changedTouches[0].clientX-startX;
    const fastFlick=Math.abs(vel)>0.4&&Math.sign(vel)!==Math.sign(dir);
    const commit=Math.abs(dx)>viewW*0.30||fastFlick;
    const commitDur='transform .25s cubic-bezier(.25,.46,.45,.94)', snapDur='transform .2s cubic-bezier(.4,0,.6,1)';
    if(commit){
      CURRENT_TAB=targetN;
      [1,2,3,4,5].forEach(i=>getBtnEl(i).classList.toggle('active',CURRENT_TAB===i));
      positionTabIndicator(CURRENT_TAB,true);
      curEl.style.transition=commitDur; targetEl.style.transition=commitDur;
      curEl.style.transform='translateX('+(-dir*viewW)+'px)'; targetEl.style.transform='translateX(0)';
      setTimeout(()=>{ curEl.style.cssText='display:none'; targetEl.style.cssText=''; viewport.style.height=''; },260);
    } else {
      positionTabIndicator(curN,true);
      curEl.style.transition=snapDur; targetEl.style.transition=snapDur;
      curEl.style.transform=''; targetEl.style.transform='translateX('+(dir*viewW)+'px)';
      setTimeout(()=>{ targetEl.style.display='none'; curEl.style.cssText=''; targetEl.style.cssText=''; viewport.style.height=''; },220);
    }
    phase='idle';
  }
  document.addEventListener('touchstart',onTouchStart,{passive:true});
  document.addEventListener('touchmove',onTouchMove,{passive:false});
  document.addEventListener('touchend',onTouchEnd,{passive:true});
})();

// ══ CÁLCULOS ══
function recFor(addr,comp){ return DB.recebimentos.find(r=>norm(r['Endereço'])===norm(addr) && String(r['Competência'])===comp); }
function rentStatus(casa,comp){
  const rec=recFor(casa['Endereço'],comp);
  if(rec) return { paid:true, label:rec['Status']||'Pago', cls:(rec['Multa']>0?'b-late':'b-paid'), total:parseAmt(rec['Total Recebido']), rowNum:rec._row };
  const [y,m]=comp.split('-').map(Number); const today=new Date(); today.setHours(0,0,0,0);
  const day1=new Date(y,m-1,1), day10=new Date(y,m-1,10,23,59,59);
  if(today<=day1) return { paid:false, label:'No prazo (pendente)', cls:'b-pend' };
  if(today<=day10) return { paid:false, label:'Pendente (sem multa)', cls:'b-pend' };
  return { paid:false, label:'Atrasado (+$50)', cls:'b-late' };
}
function daysUntil(v){ const d=parseDate(v); if(!d)return null; const t=new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0); return Math.round((d-t)/86400000); }
function expiryBadge(v,kind){ const days=daysUntil(v); if(days==null)return ''; if(days<0)return '<span class="badge2 b-late"><i class="fas fa-triangle-exclamation"></i> '+kind+' vencido</span>'; if(days<=31)return '<span class="badge2 b-warn"><i class="fas fa-triangle-exclamation"></i> '+kind+' vence em '+days+'d</span>'; if(days<=62)return '<span class="badge2 b-info"><i class="fas fa-clock"></i> '+kind+' vence em ~'+Math.round(days/30)+' meses</span>'; return ''; }

// ══ TAB 1 — DASHBOARD ══
const MESLONG=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let dashComp = todayComp();
function dashMonth(delta){ const [y,m]=dashComp.split('-').map(Number); const d=new Date(y,m-1+delta,1); dashComp=d.getFullYear()+'-'+pad2(d.getMonth()+1); renderDash(); }
function dashToday(){ dashComp=todayComp(); renderDash(); }
function slugAddr(a){ return 'house-'+norm(a).replace(/[^a-z0-9]+/g,'-'); }
function shortAddr(a){ const m=String(a||'').match(/\d+[A-Za-z]?/); return m?m[0]:(String(a||'').trim().split(/\s+/)[0]||'—'); }
function multaPreview(comp){ const [y,m]=comp.split('-').map(Number); const day10=new Date(y,m-1,10,23,59,59); return new Date()>day10?50:0; }
function isAgua(t){ const n=norm(t); return n==='água'||n==='agua'; }
function isMortgage(t){ return norm(t)==='mortgage'; }
// água paga pelo proprietário e repassada ao inquilino, na competência informada (soma dos lançamentos)
function aguaRepasseFor(addr,comp){ return DB.custos.filter(c=>norm(c['Endereço'])===norm(addr)&&String(c['Competência'])===comp&&isAgua(c['Tipo'])&&norm(c['Pagador'])==='inquilino').reduce((s,c)=>s+parseAmt(c['Valor']),0); }
// aluguel esperado no mês = aluguel + água repassada
function expectedRent(c,comp){ return parseAmt(c['Aluguel Mensal'])+aguaRepasseFor(c['Endereço'],comp); }
function houseState(c,comp){
  if(!isOcupada(c)) return { key:'vac' };
  const rec=recFor(c['Endereço'],comp);
  if(rec){
    const received=parseAmt(rec['Valor do Aluguel']);
    const expected=expectedRent(c,comp);
    const falta=Math.round((expected-received)*100)/100;
    if(expected>0 && falta>0.005) return { key:'partial', total:parseAmt(rec['Total Recebido']), multa:parseAmt(rec['Multa']), received, expected, falta };
    return { key:'paid', total:parseAmt(rec['Total Recebido']), multa:parseAmt(rec['Multa']) };
  }
  const [y,m]=comp.split('-').map(Number); const today=new Date(); today.setHours(0,0,0,0);
  const day1=new Date(y,m-1,1), day10=new Date(y,m-1,10,23,59,59);
  if(today<=day1) return { key:'pend', label:'No prazo' };
  if(today<=day10) return { key:'pend', label:'Pendente' };
  return { key:'late', label:'Atrasado' };
}

function renderDash(){
  const comp=dashComp;
  const casas=casasOrdered();
  const states=casas.map(c=>({ c, s:houseState(c,comp) }));
  const occ =states.filter(x=>x.s.key!=='vac');
  const paid=occ.filter(x=>x.s.key==='paid');
  const late=occ.filter(x=>x.s.key==='late');
  const pend=occ.filter(x=>x.s.key==='pend');
  const part=occ.filter(x=>x.s.key==='partial');
  const vac =states.filter(x=>x.s.key==='vac');
  let recebido=0; DB.recebimentos.filter(r=>String(r['Competência'])===comp).forEach(r=>recebido+=parseAmt(r['Total Recebido']));
  const aReceber=late.concat(pend).reduce((t,x)=>t+expectedRent(x.c,comp),0)+part.reduce((t,x)=>t+x.s.falta,0);

  // ── month navigator ──
  const [yy,mm]=comp.split('-'); const isCur=comp===todayComp();
  const nav='<div class="mnav"><button class="mnav-arw" onclick="dashMonth(-1)" aria-label="Mês anterior">‹</button>'
    +'<div class="mnav-lbl">'+(MESLONG[+mm-1]||'')+' <b>'+yy+'</b></div>'
    +'<button class="mnav-arw" onclick="dashMonth(1)" aria-label="Próximo mês">›</button>'
    +(isCur?'':'<button class="mnav-today" onclick="dashToday()">hoje</button>')+'</div>';

  // ── rent-roll strip (cadastro order) ──
  const segCls={paid:'s-paid',late:'s-late',pend:'s-pend',partial:'s-partial',vac:'s-vac'};
  const segTxt={paid:'Recebido',late:'Atrasado',pend:'Pendente',partial:'Parcial',vac:'Vacância'};
  const strip=states.map(x=>'<div class="rr-seg" title="'+esc(x.c['Endereço'])+' — '+segTxt[x.s.key]+'" onclick="scrollHouse(\''+slugAddr(x.c['Endereço'])+'\')"><div class="rr-cell '+segCls[x.s.key]+'"></div><div class="rr-num">'+esc((x.c['Endereço']))+'</div></div>').join('');
  const out = occ.length===0 ? 'sem casas ocupadas'
    : (aReceber>0 ? '<b>'+$$(recebido)+'</b> recebido · <b>'+$$(aReceber)+'</b> a receber'
                  : '<b>'+$$(recebido)+'</b> · tudo recebido ✓');
  const legend='<span class="lg"><span class="dot" style="background:var(--paid)"></span><b>'+paid.length+'</b>&nbsp;de&nbsp;'+occ.length+' recebidas</span>'
    +(pend.length?'<span class="lg"><span class="dot" style="background:var(--pend)"></span><b>'+pend.length+'</b> pendente'+(pend.length>1?'s':'')+'</span>':'')
    +(part.length?'<span class="lg"><span class="dot" style="background:var(--partial)"></span><b>'+part.length+'</b> parcial'+(part.length>1?'is':'')+'</span>':'')
    +(late.length?'<span class="lg"><span class="dot" style="background:var(--late)"></span><b>'+late.length+'</b> atrasada'+(late.length>1?'s':'')+'</span>':'')
    +(vac.length?'<span class="lg"><span class="dot" style="background:var(--vaca)"></span><b>'+vac.length+'</b> vaga'+(vac.length>1?'s':'')+'</span>':'');
  const coll='<div class="coll"><div class="coll-eyebrow"><span class="lab">Coleta de aluguéis</span>'
    +'<span class="out'+(aReceber<=0&&occ.length?' done':'')+'">'+out+'</span></div>'
    +'<div class="rr">'+strip+'</div><div class="rr-legend">'+legend+'</div></div>';

  // ── renewals strip (relative to today, ≤62d) ──
  const renews=[];
  casas.forEach(c=>[['Fim do Contrato','Contrato'],['Vigência do Seguro','Seguro']].forEach(([f,kind])=>{ const d=daysUntil(c[f]); if(d!=null&&d<=62) renews.push({addr:c['Endereço'],kind,days:d}); }));
  renews.sort((a,b)=>a.days-b.days);
  const renewHTML = renews.length ? '<div class="renew"><div class="renew-h"><i class="fas fa-bell"></i> Renovações próximas</div><div class="renew-items">'
    +renews.map(r=>{ const cls=r.days<0?'late':(r.days<=31?'warn':'info'); const txt=r.days<0?('vencido há '+Math.abs(r.days)+'d'):(r.days+'d'); return '<span class="renew-chip '+cls+'" onclick="scrollHouse(\''+slugAddr(r.addr)+'\')"><span class="kv">'+r.kind+'</span> '+esc(r.addr)+' <b>'+txt+'</b></span>'; }).join('')
    +'</div></div>' : '';

  // ── house grid (sorted: late → pend → vac → paid) ──
  const rank={late:0,partial:1,pend:2,vac:3,paid:4};
  const sorted=states.slice().sort((a,b)=>rank[a.s.key]-rank[b.s.key]);
  const grid='<div class="hgrid">'+(sorted.length?sorted.map(x=>hcardHTML(x.c,x.s)).join(''):'<div class="empty"><i class="fas fa-house"></i>Nenhuma casa cadastrada</div>')+'</div>';

  document.getElementById('tab1').innerHTML = nav + coll + renewHTML + grid;
}

function hcardHTML(c,s){
  const addr=c['Endereço'], slug=slugAddr(addr), eAddr=esc(addr).replace(/'/g,"\\'");
  const stCls={paid:'s-paid',late:'s-late',pend:'s-pend',partial:'s-partial',vac:'s-vac'}[s.key];
  const pill={ paid:'<span class="pill p-paid">Recebido</span>', late:'<span class="pill p-late">Atrasado</span>',
    pend:'<span class="pill p-pend">'+esc(s.label||'Pendente')+'</span>', partial:'<span class="pill p-partial">Parcial</span>', vac:'<span class="pill p-vac">Vacância</span>' }[s.key];
  const badges=[]; const ce=expiryBadge(c['Fim do Contrato'],'Contrato'); if(ce)badges.push(ce);
  const se=expiryBadge(c['Vigência do Seguro'],'Seguro'); if(se)badges.push(se);
  const aguaRep=aguaRepasseFor(addr,dashComp);
  const aluguel=parseAmt(c['Aluguel Mensal']);
  let action;
  if(s.key==='vac') action='<button class="act-btn vac" onclick="editCasa(\''+eAddr+'\')"><i class="fas fa-user-plus"></i> Definir inquilino</button>';
  else if(s.key==='paid'){ const extra=s.multa>0?' · multa $'+Math.round(s.multa):''; action='<button class="act-btn paid" onclick="openReceb(\''+eAddr+'\')"><i class="fas fa-check-circle"></i> Recebido '+$$(s.total)+extra+' · editar</button>'; }
  else if(s.key==='partial') action='<div id="act-'+slug+'" style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:stretch">'
      +'<div class="hcard-flag"><i class="fas fa-flag"></i> Falta '+$$(s.falta)+' de '+$$(s.expected)+'</div>'
      +'<button class="act-btn partial" onclick="openReceb(\''+eAddr+'\')"><i class="fas fa-hand-holding-dollar"></i> Registrar restante</button></div>';

// Modal de recebimento
let _recebExpected=0, _recebPrev=0, _recebMode='total';
function openReceb(addr,compArg){
  const c=DB.casas.find(x=>norm(x['Endereço'])===norm(addr)); if(!c)return;
  const comp=compArg||((typeof dashComp!=='undefined'&&dashComp)?dashComp:todayComp()); const rec=recFor(addr,comp);
  const aluguel=parseAmt(c['Aluguel Mensal']); const aguaRep=aguaRepasseFor(addr,comp);
  _recebExpected=aluguel+aguaRep;
  _recebPrev=rec?parseAmt(rec['Valor do Aluguel']):0;
  const faltaAtual=Math.round((_recebExpected-_recebPrev)*100)/100;
  // se já existe um recebimento parcial nesse mês → modo "parcela" (pede só o que falta)
  _recebMode=(rec && faltaAtual>0.005)?'installment':'total';
  const expHint=aguaRep>0?('esperado <b>'+$$(_recebExpected)+'</b> ('+$$(aluguel)+' aluguel + '+$$(aguaRep)+' água)'):('esperado <b>'+$$(_recebExpected)+'</b>');
  const prevBox=(_recebMode==='installment')
    ? '<div class="receb-prev"><i class="fas fa-clock-rotate-left"></i> Já recebido <b>'+$$(_recebPrev)+'</b> de '+$$(_recebExpected)+' — falta <b>'+$$(faltaAtual)+'</b>. Informe abaixo o valor <b>deste</b> pagamento; será somado ao já recebido.</div>'
    : '';
  const valLabel=(_recebMode==='installment')?'Valor deste pagamento':'Valor recebido';
  const valDefault=(_recebMode==='installment')?faltaAtual:(rec?_recebPrev:_recebExpected);
  openModal('<div class="modal-title"><i class="fas fa-hand-holding-dollar"></i> Recebimento — '+esc(addr)+'</div>'
    +prevBox
    +'<div class="grid2">'
    +'<div><label class="f-label">Competência</label><input class="f-input" id="rcComp" value="'+comp+'" placeholder="YYYY-MM"></div>'
    +'<div><label class="f-label">'+valLabel+'</label><input class="f-input" id="rcVal" type="number" step="0.01" oninput="onRecebInput()" value="'+valDefault+'"></div>'
    +'</div>'
    +'<div style="font-size:11.5px;color:#7b8ea4;margin:6px 0 12px"><i class="fas fa-info-circle"></i> Valor '+expHint+'.</div>'
    +'<div class="receb-flag" id="rcFlag"></div>'
    +'<div class="mb"><label class="f-label">Data do pagamento</label><input class="f-input" id="rcData" type="date" value="'+((_recebMode==='installment'||!rec)?todayISO():isoOf(rec['Data do Pagamento']))+'"></div>'
    +'<div class="mb"><label class="f-label">Observações</label><input class="f-input" id="rcObs" value="'+(rec?esc(rec['Observações']||''):'')+'"></div>'
    +'<div style="font-size:12px;color:#7b8ea4;margin-bottom:14px"><i class="fas fa-info-circle"></i> Até dia 1: no prazo · até dia 10: atraso sem multa · após dia 10: +$50 de multa.</div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end">'
    +(rec?'<button class="mini-btn danger" onclick="delReceb('+rec._row+')"><i class="fas fa-trash"></i> Excluir</button>':'')
    +'<button class="mini-btn sec" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn-primary2" onclick="saveReceb(\''+esc(addr).replace(/'/g,"\\'")+'\')">Salvar</button></div>');
  onRecebInput();
}
function onRecebInput(){
  const inp=document.getElementById('rcVal'), el=document.getElementById('rcFlag'); if(!el||!inp)return;
  const v=parseFloat(inp.value)||0;
  const totalAfter=(_recebMode==='installment')?Math.round((_recebPrev+v)*100)/100:v;
  const falta=Math.round((_recebExpected-totalAfter)*100)/100;
  if(_recebExpected>0 && falta>0.005){ el.className='receb-flag'; el.style.display='block'; el.innerHTML='<i class="fas fa-flag"></i> '+(_recebMode==='installment'?'Ainda faltará ':'Pagamento parcial — falta ')+'<b>'+$$(falta)+'</b> de '+$$(_recebExpected)+'. A casa fica laranja até quitar.'; }
  else if(_recebExpected>0){ el.className='receb-flag ok'; el.style.display='block'; el.innerHTML='<i class="fas fa-check-circle"></i> Quita o mês — total recebido '+$$(totalAfter)+' de '+$$(_recebExpected)+'.'; }
  else{ el.style.display='none'; }
}
function isoOf(v){ const d=parseDate(v); return d?d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()):todayISO(); }
async function saveReceb(addr){
  const raw=parseFloat(document.getElementById('rcVal').value);
  if(isNaN(raw)){ showToast('Valor obrigatório',true); return; }
  const total=(_recebMode==='installment')?Math.round((_recebPrev+raw)*100)/100:raw;
  try{ await apiWrite({action:'markRecebido',addr,competencia:document.getElementById('rcComp').value.trim(),valorAluguel:total,dataPagamento:document.getElementById('rcData').value,obs:document.getElementById('rcObs').value});
    closeModal(); showToast(_recebMode==='installment'?'Pagamento somado ao recebido':'Recebimento salvo'); await loadData();
  }catch(e){ showToast(e.message,true); }
}

async function moveCasa(idx,dir){
  if(_reordering)return; const list=casasOrdered(); const j=idx+dir;
  if(j<0||j>=list.length)return;
  const arr=list.map(c=>c['Endereço']); const tmp=arr[idx]; arr[idx]=arr[j]; arr[j]=tmp;
  const pos={}; arr.forEach((a,i)=>pos[norm(a)]=i+1);
  DB.casas.forEach(c=>{ const p=pos[norm(c['Endereço'])]; if(p) c['Ordem']=p; });
  _reordering=true; renderCad(); renderDash();
  try{ await apiWrite({action:'reorderCasas',order:arr}); }
  catch(e){ showToast(e.message,true); }
  finally{ _reordering=false; }
}

function ktVigFill(){
  const c=DB.casas.find(x=>norm(x['Endereço'])===norm(document.getElementById('ktCasa').value));

  if(!vig){ showToast('Casa sem vigência do seguro cadastrada',true); return; }
  const [sy,sm]=custComp.split('-').map(Number);
  const months=(vig.getFullYear()-sy)*12+((vig.getMonth()+1)-sm)+1;
  if(months<1){ showToast('Vigência do seguro já passou',true); return; }
  document.getElementById('ktMeses').value=months; showToast(months+' meses até a vigência');
}

let FIN_COMP=todayComp();
function renderFin(){
  const comp=FIN_COMP;
  const casas=DB.casas.filter(c=>String(c['Endereço']||'').trim());
  let totRec=0, totCus=0;
  const rows=casas.map(c=>{
    const addr=c['Endereço'];
    // receita = recebimentos (já incluem a água repassada, que é cobrada junto do aluguel)
    const rec=DB.recebimentos.filter(r=>norm(r['Endereço'])===norm(addr)&&String(r['Competência'])===comp).reduce((s,r)=>s+parseAmt(r['Total Recebido']),0);
    // custos lançados (exclui mortgage, que é fixo do cadastro) + manutenção + mortgage fixo
    let cus=DB.custos.filter(r=>norm(r['Endereço'])===norm(addr)&&String(r['Competência'])===comp&&!isMortgage(r['Tipo'])).reduce((s,r)=>s+parseAmt(r['Valor']),0);
    cus+=DB.manutencao.filter(r=>norm(r['Endereço'])===norm(addr)&&String(r['Competência'])===comp).reduce((s,r)=>s+parseAmt(r['Valor do Serviço']),0);
    cus+=parseAmt(c['Mortgage Mensal']);
    totRec+=rec; totCus+=cus;
    const res=rec-cus;
    return '<tr><td><strong>'+esc(addr)+'</strong></td><td style="color:#27ae60;font-weight:700">'+$$(rec)+'</td><td style="color:#e74c3c;font-weight:700">'+$$(cus)+'</td><td style="font-weight:800;color:'+(res>=0?'#27ae60':'#e74c3c')+'">'+$$(res)+'</td></tr>';
  }).join('');
  const deposits=casas.reduce((s,c)=>s+parseAmt(c['Security Deposit']),0);
  document.getElementById('tab5').innerHTML=
    '<div class="card2"><div class="sec-title"><i class="fas fa-calculator"></i> Financeiro por competência'
    +'<input type="month" class="f-input" style="width:auto;margin-left:auto" value="'+comp+'" onchange="FIN_COMP=this.value;renderFin()"></div>'
    +'<div class="metric-row">'
    +'<div class="metric green"><div class="lbl">Receitas '+fmtComp(comp)+'</div><div class="val">'+$$(totRec)+'</div></div>'
    +'<div class="metric red"><div class="lbl">Custos '+fmtComp(comp)+'</div><div class="val">'+$$(totCus)+'</div></div>'
    +'<div class="metric '+(totRec-totCus>=0?'green':'red')+'"><div class="lbl">Resultado</div><div class="val">'+$$(totRec-totCus)+'</div></div>'
    +'<div class="metric"><div class="lbl">Provisões (depósitos)</div><div class="val">'+$$(deposits)+'</div></div>'
    +'</div>'
    +'<div class="tbl-wrap"><table><thead><tr><th>Casa</th><th>Receita</th><th>Custos</th><th>Resultado</th></tr></thead><tbody>'+(rows||'<tr><td colspan="4" class="empty">Sem casas</td></tr>')
    +'<tr style="background:#f8fafd;font-weight:800"><td>TOTAL</td><td style="color:#27ae60">'+$$(totRec)+'</td><td style="color:#e74c3c">'+$$(totCus)+'</td><td style="color:'+(totRec-totCus>=0?'#27ae60':'#e74c3c')+'">'+$$(totRec-totCus)+'</td></tr>'
    +'</tbody></table></div></div>'
    +'<div class="card2"><div class="sec-title"><i class="fas fa-chart-line"></i> Detalhe dos lançamentos — '+fmtComp(comp)+'</div>'+finDetail(comp)+'</div>';
}
function finDetail(comp){
  const items=[];
  DB.recebimentos.filter(r=>String(r['Competência'])===comp).forEach(r=>items.push({casa:r['Endereço'],tipo:'Aluguel recebido'+(aguaRepasseFor(r['Endereço'],comp)>0?' (inclui água)':''),valor:parseAmt(r['Total Recebido']),sign:1,data:r['Data do Pagamento'],src:'rec',row:r._row}));
  DB.custos.filter(r=>String(r['Competência'])===comp&&!isMortgage(r['Tipo'])).forEach(r=>items.push({casa:r['Endereço'],tipo:r['Tipo']||'Custo',valor:parseAmt(r['Valor']),sign:-1,data:r['Data do Pagamento'],src:'custo',row:r._row}));
  DB.casas.filter(c=>String(c['Endereço']||'').trim()&&parseAmt(c['Mortgage Mensal'])>0).forEach(c=>items.push({casa:c['Endereço'],tipo:'Mortgage (fixo mensal)',valor:parseAmt(c['Mortgage Mensal']),sign:-1,data:'',src:'mortgage'}));
  DB.manutencao.filter(r=>String(r['Competência'])===comp).forEach(r=>items.push({casa:r['Endereço'],tipo:'Manutenção: '+(r['Tipo de Serviço']||''),valor:parseAmt(r['Valor do Serviço']),sign:-1,data:r['Data de Conclusão'],src:'man',row:r._row}));
  if(!items.length) return '<div class="empty"><i class="fas fa-receipt"></i>Nenhum lançamento nesta competência</div>';
  const rows=items.map(i=>{ const eAddr=esc(i.casa).replace(/'/g,"\\'");
    return '<tr><td>'+esc(i.casa)+'</td><td>'+esc(i.tipo)+'</td><td>'+fmtDate(i.data)+'</td>'
    +'<td style="font-weight:700;color:'+(i.sign>0?'#27ae60':'#e74c3c')+'">'+(i.sign>0?'+':'-')+$$(i.valor)+'</td>'
    +'<td style="white-space:nowrap">'+finRowActions(i,eAddr,comp)+'</td></tr>'; }).join('');
  return '<div class="tbl-wrap"><table><thead><tr><th>Casa</th><th>Lançamento</th><th>Data</th><th>Valor</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function finRowActions(i,eAddr,comp){
  if(i.src==='rec') return '<button class="mini-btn sec" title="Editar" onclick="openReceb(\''+eAddr+'\',\''+comp+'\')"><i class="fas fa-pen"></i></button> <button class="mini-btn danger" title="Excluir" onclick="delReceb('+i.row+')"><i class="fas fa-trash"></i></button>';
  if(i.src==='custo') return '<button class="mini-btn sec" title="Editar" onclick="editCusto('+i.row+')"><i class="fas fa-pen"></i></button> <button class="mini-btn danger" title="Excluir" onclick="delCusto('+i.row+')"><i class="fas fa-trash"></i></button>';
  if(i.src==='man') return '<button class="mini-btn sec" title="Editar" onclick="editMan('+i.row+')"><i class="fas fa-pen"></i></button> <button class="mini-btn danger" title="Excluir" onclick="delMan('+i.row+')"><i class="fas fa-trash"></i></button>';
  if(i.src==='mortgage') return '<button class="mini-btn sec" title="Editar mortgage no cadastro da casa" onclick="editCasa(\''+eAddr+'\')"><i class="fas fa-pen"></i></button> <span title="Custo fixo do cadastro — não é excluível aqui" style="color:#9aabbd;font-size:12px;padding:0 4px"><i class="fas fa-lock"></i></span>';
  return '';
}

// Password sempre exigida — sem auto-login.
</script>
